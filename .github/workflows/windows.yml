name: Windows build and verification

on:
  push:
    branches: [master, main, beta]
    tags: ['v*']
  pull_request:
    branches: [master, main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: Static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/config/frontend/package-lock.json
      - name: Test identities, release admission and duplicate protection
        run: node --test scripts/tests/*.test.mjs
      - name: Check product version declarations
        shell: pwsh
        run: ./scripts/sync-version.ps1 -Check
      - name: Check and test settings UI
        run: |
          npm ci --prefix crates/config/frontend
          npm --prefix crates/config/frontend run build
          npm --prefix crates/config/frontend test

  build:
    name: Build installer and test
    needs: checks
    if: github.repository == 'yachtida/nospacekey' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created == true && github.event.deleted == false && github.event.forced == false
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      installer_id: ${{ steps.installer.outputs.artifact-id }}
      verification_id: ${{ steps.verification.outputs.artifact-id }}
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_TERM_COLOR: always
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/config/frontend/package-lock.json
      - name: Test build identity and duplicate protection
        run: node --test scripts/tests/ci-identity.test.mjs scripts/tests/release-identity.test.mjs scripts/tests/manual-release.test.mjs
      - name: Check source product version declarations
        run: ./scripts/sync-version.ps1 -Check
      - name: Assign an installable build version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-version.ps1
      - name: Cache toolchain installers
        id: installer-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-downloads
          key: windows-2022-installers-${{ hashFiles('scripts/ci-setup.ps1') }}
      - name: Install Windows build tools
        run: ./scripts/ci-setup.ps1
      - name: Save toolchain installers
        if: steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-downloads
          key: ${{ steps.installer-cache.outputs.cache-primary-key }}
      - name: Cache Vulkan runtime build
        id: runtime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .llama-build
            engine-host/vendor/llama/vulkan
            engine-host/prediction-runtime
          key: windows-2022-vulkan-${{ env.ImageVersion }}-${{ hashFiles('scripts/build-llama.ps1', 'scripts/zenzai-runtime-manifest.ps1', 'scripts/ci-setup.ps1', 'scripts/build-prediction-runtime.ps1', 'scripts/prediction-runtime-contract.ps1', 'patches/*.patch') }}
      - name: Build Vulkan runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          & ./scripts/with-dev-env.ps1 @('pwsh', '-NoProfile', '-File', 'scripts/build-llama.ps1', '-Vulkan')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/with-dev-env.ps1 @('pwsh', '-NoProfile', '-File', 'scripts/build-prediction-runtime.ps1', '-SourceDir', '.llama-build/prediction-source')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Vulkan runtime build
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .llama-build
            engine-host/vendor/llama/vulkan
            engine-host/prediction-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Restore Rust and Swift build cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            engine-host/.build
          key: windows-2022-rust-1.96-swift-6.3.2-${{ hashFiles('Cargo.lock', 'engine-host/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            windows-2022-rust-1.96-swift-6.3.2-${{ hashFiles('Cargo.lock', 'engine-host/Package.resolved') }}-
      - name: Build and test settings UI
        run: |
          ./scripts/build-config-ui.ps1
          npm --prefix crates/config/frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Rust workspace
        timeout-minutes: 15
        run: |
          & ./scripts/with-dev-env.ps1 @('cargo', 'test', '--locked', '--workspace')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release binaries
        id: release-build
        run: |
          & ./scripts/with-dev-env.ps1 @('cargo', 'build', '--locked', '--release', '--workspace')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location engine-host
          try {
            & ../scripts/with-dev-env.ps1 @('swift', 'build', '-c', 'release', '--force-resolved-versions')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Test Swift engine
        timeout-minutes: 20
        run: |
          Push-Location engine-host
          try {
            & ../scripts/with-dev-env.ps1 @('swift', 'test', '-c', 'release', '--force-resolved-versions')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Save Rust and Swift build cache
        if: always() && steps.release-build.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            engine-host/.build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Stage runtime and test real IPC
        timeout-minutes: 10
        run: |
          ./scripts/stage-dist.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NOSPACEKEY_TEST_ENGINE_DIR = (Resolve-Path dist).Path
          & ./scripts/with-dev-env.ps1 @('cargo', 'test', '--locked', '-p', 'ipc', '--test', 'integration', 'tip_like', '--', '--ignored', '--nocapture')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package development-signed installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-package.ps1
      - name: Upload installer for download
        id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nospacekey-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/download/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Upload installation test inputs
        id: verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-downloads/*.log*
            artifacts/reports/
          if-no-files-found: ignore
          retention-days: 7

  verify-install:
    name: Install and exercise IME on a clean Windows VM
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.installer_id }}
          merge-multiple: true
          path: artifacts/download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.verification_id }}
          merge-multiple: true
          path: artifacts/verification
      - name: Install, verify payload hashes and run TSF scenarios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-verify-install.ps1
      - name: Upload installation and input test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/reports/
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Prepare verified manual release files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-manual-release.mjs
      - name: Upload verified manual release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nospacekey-release-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-ready/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
