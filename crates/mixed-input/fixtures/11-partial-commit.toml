# 部分確定の契約例（計画書 8.4）。expected は宣言ソース全体の解釈を被覆し、
# commit_prefix はその接頭辞を確定することを表す。
# 確定境界が Literal 区間の途中を割らないことを E_COMMIT_FENCE で要求する。

[[episode]]
id = "pc-001"
category = "partial_commit"
source = "kyouhaPythonwotukau"
expected = [
  { kind = "japanese", text = "kyouha" },
  { kind = "literal", text = "Python" },
  { kind = "japanese", text = "wotukau" },
]
events = ["type:kyouhaPythonwotukau", "commit_prefix:6"]
notes = "日本語 prefix を確定し、Literal を残す。境界は Literal 直前"

