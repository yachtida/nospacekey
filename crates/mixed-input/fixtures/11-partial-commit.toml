expected = [
  { kind = "japanese", text = "kyouha" },
  { kind = "literal", text = "Python" },
  { kind = "japanese", text = "wotukau" },
]
events = ["type:kyouhaPythonwotukau", "commit_prefix:12"]
notes = "Literal 直後まで確定"

