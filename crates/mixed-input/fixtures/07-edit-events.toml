# 途中編集の契約例（計画書 11 の編集区分）。
# source は打鍵列の再生結果として一致することを要求する（E_REPLAY_CONSISTENCY）。
# PR1 の再生器は scalar 単位の素朴な削除。実際のかな削除・未完ローマ字の
# 操作契約は既存 composer のままであり、PR2 の CompositionSource が由来を担う。

[[episode]]
id = "ed-001"
category = "edit_events"
source = "kyou"
expected = "all_japanese"
events = ["type:kyouha", "delete_backward:2"]
notes = "後続2文字の削除で「きょは」から戻る"

[[episode]]
id = "ed-002"
category = "edit_events"
source = "kyouha"
expected = "all_japanese"
