<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nospacekey — Space を押さない。モードと戦わない。</title>
<meta name="description" content="打鍵に追随して変換が進むライブ変換と、確定した瞬間に半角英数へ戻る一時日本語モード。Windows 用のかな漢字変換 IME。変換も学習もローカル完結、オープンソース(MIT)。">
<meta property="og:title" content="nospacekey — Space を押さない。モードと戦わない。">
<meta property="og:description" content="打鍵に追随して変換が進むライブ変換と、確定した瞬間に半角英数へ戻る一時日本語モード。Windows 用のかな漢字変換 IME。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yachtida.github.io/nospacekey/">
<meta property="og:image" content="https://yachtida.github.io/nospacekey/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://yachtida.github.io/nospacekey/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231D3A6B'/%3E%3Ctext x='32' y='46' font-size='40' font-family='serif' fill='%23FCFCFA' text-anchor='middle'%3Eあ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --kami:#FCFCFA;
    --sumi:#14161A;
    --usuzumi:#6B7280;
    --kei:#E5E3DE;
    --ai:#1D3A6B;
    --shu:#C1392C;
    --mincho:"Zen Old Mincho",'Hiragino Mincho ProN','Yu Mincho',serif;
    --gothic:"Noto Sans JP",'Hiragino Sans','Yu Gothic UI',sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --kami:#16171A;
      --sumi:#E8E6E1;
      --usuzumi:#8B9098;
      --kei:#2A2C31;
      --ai:#8FB0E8;
      --shu:#E8776B;
    }
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--kami);color:var(--sumi);
    font-family:var(--gothic);font-size:16px;line-height:1.95;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 24px}
  p{max-width:34em}
  a{color:var(--ai);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em}
  :focus-visible{outline:2px solid var(--ai);outline-offset:3px}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  h1{
    font-family:var(--mincho);font-weight:600;
    font-size:clamp(40px,7.5vw,80px);line-height:1.45;letter-spacing:.02em;
    font-feature-settings:"palt" 1;
  }
  h2{
    font-family:var(--mincho);font-weight:600;
    font-size:clamp(24px,3.4vw,34px);line-height:1.5;letter-spacing:.02em;
    font-feature-settings:"palt" 1;margin-bottom:32px;
  }
  section{padding:120px 0 0}

  kbd{
    font-family:var(--mono);font-size:.85em;
    border:1px solid var(--kei);border-bottom-width:2px;border-radius:0;
    padding:1px 6px;white-space:nowrap;
  }
  code{font-family:var(--mono);font-size:.9em}

  header{padding:28px 0 0}
  .nav{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--kei)}
  .mark{
    width:28px;height:28px;flex:none;display:grid;place-items:center;
    font-family:var(--mincho);font-size:17px;
    color:var(--kami);background:var(--ai);
  }
  .wordmark{font-family:var(--mono);font-size:15px;letter-spacing:.02em}
  .nav .sp{flex:1}
  .nav a{color:var(--sumi);font-size:14px;text-decoration:none;border-bottom:1px solid var(--kei)}

  footer{margin-top:120px;border-top:1px solid var(--kei);padding:32px 0 64px}
  footer p{font-size:13px;line-height:1.85;color:var(--usuzumi);max-width:38em}
  footer p+p{margin-top:12px}
  footer a{color:var(--usuzumi)}

  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<header class="wrap">
  <nav class="nav" aria-label="グローバル">
    <span class="mark" aria-hidden="true">あ</span>
    <span class="wordmark">nospacekey</span>
    <span class="sp"></span>
    <a href="https://github.com/yachtida/nospacekey">GitHub</a>
  </nav>
</header>

<main>
</main>

<footer>
  <div class="wrap">
  </div>
</footer>

</body>
</html>
